<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102449" />
    <meta name="description" content="Sonny의 GitHub Pages 홈페이지" />
    <title>Sonny · Home</title>
    <style>
      :root {
        --bg: #0d1b2e;
        --card: #16273f;
        --accent: #4f9cf9;
        --text: #e8eef7;
        --muted: #9fb0c8;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, "Segoe UI", "Apple SD Gothic Neo", sans-serif;
        background: linear-gradient(160deg, #102449 0%, #0d1b2e 100%);
        color: var(--text);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: var(--card);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        padding: 48px 40px;
        max-width: 560px;
        width: 100%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
      }
      .avatar {
        width: 72px; height: 72px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), #8f6bff);
        display: flex; align-items: center; justify-content: center;
        font-size: 32px; font-weight: 700;
        margin-bottom: 24px;
      }
      h1 { font-size: 28px; margin-bottom: 8px; }
      p.tag { color: var(--muted); font-size: 16px; line-height: 1.6; margin-bottom: 28px; }
      .links { display: flex; flex-direction: column; gap: 12px; }
      a.link {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 18px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        color: var(--text);
        text-decoration: none;
        font-size: 15px;
        transition: all 0.15s ease;
      }
      a.link:hover { background: rgba(79, 156, 249, 0.15); border-color: var(--accent); transform: translateY(-1px); }
      a.link span.arrow { color: var(--muted); }
      footer { margin-top: 28px; color: var(--muted); font-size: 13px; text-align: center; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="avatar">S</div>
      <h1>안녕하세요, Sonny입니다 👋</h1>
      <p class="tag">
        이 페이지는 GitHub Pages로 무료 배포된 정적 웹사이트입니다.
        아래 내용을 자유롭게 수정해서 나만의 홈페이지로 만들어보세요.
      </p>
      <div class="links">
        <a class="link" href="https://github.com/wiserainmaker" target="_blank" rel="noopener">
          <span>🐙 GitHub 프로필</span><span class="arrow">→</span>
        </a>
        <a class="link" href="#" target="_blank" rel="noopener">
          <span>📝 블로그 / 포트폴리오</span><span class="arrow">→</span>
        </a>
        <a class="link" href="mailto:you@example.com">
          <span>✉️ 이메일 보내기</span><span class="arrow">→</span>
        </a>
      </div>
      <footer>Built with GitHub Pages · 2026</footer>
    </main>
  </body>
</html>
