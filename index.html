<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sonny — Home</title>
<style>
  :root{color-scheme:light dark}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
       max-width:720px;margin:80px auto;padding:0 20px;line-height:1.6;color:#1a1a1a;background:#fff}
  h1{font-size:1.8rem;margin-bottom:.2em}
  p.sub{color:#666;margin-top:0}

    // URL에 ?release=커밋SHA 를 붙이면 화면에 표시 (데모에서 본 방식)
    const params = new URLSearchParams(location.search);
    document.getElementById('sha').textContent = params.get('release') || 'local';
